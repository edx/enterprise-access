  it is not substituted.
  
  (2) "Product Management (Professional Certificate)" is a *program*, not a course -- program
  records carry a null key -- so it cannot be expressed as an expected course key. Worth
  raising as a product question: should pathways be able to recommend programs?
  
  Observed-run note: "Courses 2 and 4 are not relevant at all, and then the last one is in
